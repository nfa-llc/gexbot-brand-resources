# Deploys the site to the production Static Web App when a person publishes a release.
# This repository has no development environment. A push to master deploys nothing.
# The production environment accepts only a release tag in the form vYYYY.MM.XX.
name: Azure Static Web Apps Production

on:
  release:
    types: [ published ]

# Never cancel a deploy in progress. A half-uploaded Static Web App is a broken site.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    if: "!github.event.release.prerelease"
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    environment: production
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_POND_05DB4C410 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ""
